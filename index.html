<body>
  <div id="root">
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;background:linear-gradient(135deg, #0f0c29 0%, #1a1640 40%, #24243e 100%);position:fixed;inset:0;z-index:99999;height:100vh;font-family:'Inter',system-ui,-apple-system,sans-serif;">
      <style>
        @keyframes initRipple { 0% { transform: scale(0.85); opacity: 0.8; } 100% { transform: scale(1.3); opacity: 0; } }
        @keyframes initRipple2 { 0% { transform: scale(0.85); opacity: 0.6; } 100% { transform: scale(1.4); opacity: 0; } }
        @keyframes initTextPulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
        @keyframes initDotPulse { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1.2); opacity: 1; } }
      </style>
      <div style="position:relative;width:80px;height:80px;display:flex;align-items:center;justify-content:center;">
        <div style="position:absolute;inset:-12px;border-radius:50%;border:2px solid rgba(99,102,241,0.4);animation:initRipple 2.4s cubic-bezier(0,0.2,0.8,1) infinite;pointer-events:none;"></div>
        <div style="position:absolute;inset:-20px;border-radius:50%;border:2px solid rgba(99,102,241,0.4);animation:initRipple2 2.4s cubic-bezier(0,0.2,0.8,1) infinite 0.8s;pointer-events:none;"></div>
        <img
          src="/logo.png?v=1"
          alt="SMARTSCHED Loading"
          style="width:72px;height:72px;border-radius:50%;object-fit:cover;position:relative;z-index:2;box-shadow:0 8px 32px rgba(99,102,241,0.4);"
          onerror="this.onerror=null;this.src='https://upload.wikimedia.org/wikipedia/en/8/8e/Capiz_State_University_logo.png';"
        />
      </div>
      <div style="font-size:1.1rem;font-weight:600;letter-spacing:0.05em;color:rgba(255,255,255,0.9);animation:initTextPulse 2s ease-in-out infinite;display:flex;align-items:center;gap:4px;">
        Loading SMARTSCHED
        <span style="display:inline-flex;align-items:center;margin-left:4px;">
          <span style="display:inline-block;width:4px;height:4px;background:white;border-radius:50%;margin:0 2px;animation:initDotPulse 1.4s ease-in-out infinite;"></span>
          <span style="display:inline-block;width:4px;height:4px;background:white;border-radius:50%;margin:0 2px;animation:initDotPulse 1.4s ease-in-out infinite 0.2s;"></span>
          <span style="display:inline-block;width:4px;height:4px;background:white;border-radius:50%;margin:0 2px;animation:initDotPulse 1.4s ease-in-out infinite 0.4s;"></span>
        </span>
      </div>
    </div>
  </div>
